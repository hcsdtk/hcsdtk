<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Chasen profile banner</title>
  <desc id="desc">From mini apps to AI-native tools</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091526"/>
      <stop offset="1" stop-color="#0b201f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56a3ff"/>
      <stop offset="1" stop-color="#42d6ad"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#d9edff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <path d="M0 304 C250 238 405 372 650 302 C864 241 1013 247 1200 182 L1200 360 L0 360 Z" fill="#42d6ad" opacity="0.055"/>

  <g transform="translate(64 54)">
    <circle cx="25" cy="25" r="25" fill="url(#accent)"/>
    <text x="25" y="32" fill="#071422" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" text-anchor="middle">H</text>
    <text x="65" y="20" fill="#dcecff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="2.5">HCSDTK</text>
    <text x="65" y="42" fill="#89a4bd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.7">SHENZHEN · CHINA</text>

    <text x="0" y="137" fill="#f2f8ff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="68" font-weight="780" letter-spacing="-3">CHASEN</text>
    <rect x="2" y="156" width="88" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="0" y="202" fill="#dcecff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="600">From mini apps to AI-native tools.</text>
    <text x="0" y="236" fill="#89a4bd" font-family="PingFang SC, Microsoft YaHei, ui-sans-serif, system-ui, sans-serif" font-size="17">把真实问题，做成小而完整的产品。</text>
  </g>

  <g transform="translate(708 48)" filter="url(#shadow)">
    <path d="M76 68 C123 105 125 135 165 157 C211 182 253 168 297 202" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 9" opacity="0.78"/>

    <g transform="translate(0 0)">
      <rect width="180" height="94" rx="18" fill="#10263a" stroke="#28465d"/>
      <circle cx="30" cy="30" r="11" fill="#56a3ff" opacity="0.16"/>
      <path d="M25 30h10M30 25v10" stroke="#56a3ff" stroke-width="2" stroke-linecap="round"/>
      <text x="50" y="35" fill="#89a4bd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">2018—2020</text>
      <text x="24" y="70" fill="#e7f3ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">MINI APPS</text>
    </g>

    <g transform="translate(118 108)">
      <rect width="196" height="94" rx="18" fill="#102b30" stroke="#28544e"/>
      <circle cx="30" cy="30" r="11" fill="#42d6ad" opacity="0.16"/>
      <path d="M24 30h12M27 26l-3 4 3 4M33 26l3 4-3 4" fill="none" stroke="#42d6ad" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="50" y="35" fill="#89a4bd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">BROWSER-NATIVE</text>
      <text x="24" y="70" fill="#e7f3ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">WEB TOOLS</text>
    </g>

    <g transform="translate(246 204)">
      <rect width="206" height="94" rx="18" fill="#171f3a" stroke="#3a416b"/>
      <circle cx="30" cy="30" r="11" fill="#9d93ff" opacity="0.16"/>
      <path d="M24 33l4-7 3 8 3-5 3 4" fill="none" stroke="#9d93ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="50" y="35" fill="#89a4bd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">NOW BUILDING</text>
      <text x="24" y="70" fill="#e7f3ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">AGENT SKILLS</text>
    </g>
  </g>
</svg>
